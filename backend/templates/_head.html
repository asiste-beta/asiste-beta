<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0b">
<script>
    // Aplica el tema guardado ANTES de que se pinte la página, para que no
    // haya un parpadeo. Si el usuario nunca eligió nada, el tema es el oscuro.
    (function () {
        var tema = "dark";
        try { tema = localStorage.getItem("asiste_tema") || "dark"; } catch (e) {}
        tema = tema === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", tema);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta && tema === "light") meta.setAttribute("content", "#f6f6f7");
    })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
